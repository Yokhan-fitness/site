# Exact public SEO resources must never fall through to the HTML homepage.
location = /robots.txt {
    default_type text/plain;
    try_files /robots.txt =404;
}

location = /sitemap.xml {
    default_type application/xml;
    try_files /sitemap.xml =404;
}

# Unknown public paths are real 404s instead of copies of the homepage.
location / {
    try_files $uri $uri/ =404;
}
